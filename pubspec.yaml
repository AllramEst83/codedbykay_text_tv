name: codedbykay_text_tv
description: "Text TV: a viewer for SVT Text (Swedish teletext, pages 100-899) through the texttv.nu API. Built with Flutter for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_shaders: ^0.1.3
  path_provider: ^2.1.6
  quick_actions: ^1.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  shaders:
    - shaders/crt.frag

  # Bundled (OFL 1.1, see fonts/OFL.txt) so the app works offline.
  fonts:
    - family: PressStart2P
      fonts:
        - asset: fonts/PressStart2P-Regular.ttf
