name: codedbykay_text_tv
description: "Text TV: a viewer for SVT Text (Swedish teletext, pages 100-899) through the texttv.nu API. Built with Flutter for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_shaders: ^0.1.3
  home_widget: ^0.10.0
  intl: any
  path_provider: ^2.1.6
  quick_actions: ^1.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  shaders:
    - shaders/crt.frag

  # Bundled (OFL 1.1, the licences are the fonts/OFL-*.txt files) so the app
  # works offline: Press Start 2P or Bedstead (CC0) for the teletext page,
  # Atkinson Hyperlegible and OpenDyslexic as the reader's choice of typeface.
  fonts:
    - family: PressStart2P
      fonts:
        - asset: fonts/PressStart2P-Regular.ttf
    - family: Bedstead
      fonts:
        - asset: fonts/Bedstead-Regular.otf
    - family: AtkinsonHyperlegible
      fonts:
        - asset: fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: fonts/OpenDyslexic-Regular.otf
        - asset: fonts/OpenDyslexic-Bold.otf
          weight: 700
