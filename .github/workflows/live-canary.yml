name: Live canary

# Reads a few live pages from texttv.nu once a week and fails if the app could
# no longer read them with their colours (the site's markup changed). Not part
# of CI proper: a site outage must not block a commit.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/check_live.dart
